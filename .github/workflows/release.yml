name: 发布 .deb

# 三种触发方式，平时只需要 push：
#   * push 到 master —— 版本号（chuang/__init__.py）比现有 tag 新，就自动打 tag、发 Release、传 .deb
#   * push 一个 tag  —— 直接为该 tag 发版（老习惯，也留着）
#   * 手动运行       —— 补传 .deb、修 Release 说明、重跑失败的构建
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空 = v<chuang/__init__.py 里的版本号>）"
        required: false
        default: ""

permissions:
  contents: write

# 同一时间只跑一条，避免"push 分支"与"push tag"两条流程抢同一个 Release
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: 算出版本号与 tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 要拿全部 tag 来比版本

      - name: 决定要不要发版
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 packaging/ci-release-plan.py    # 自己把 key=value 写进 $GITHUB_OUTPUT

      - name: 说明
        run: |
          echo "${{ steps.plan.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "版本 ${{ steps.plan.outputs.version }} / tag ${{ steps.plan.outputs.tag }} / 发版 ${{ steps.plan.outputs.release }}"

  build:
    name: 打包并自检 .deb
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 打包 .deb
        env:
          # 自动把 Homepage 指向本仓库；署名可按需改
          PKG_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          PKG_MAINTAINER: ${{ github.repository_owner }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          cd packaging/out
          sha256sum "chuang_${VERSION}_all.deb" > SHA256SUMS
          cat SHA256SUMS

      - name: 自检：版本号对得上、包不是空的
        run: |
          set -euo pipefail
          deb="$(ls packaging/out/*.deb)"
          dpkg-deb -I "$deb" | sed -n '1,15p'
          test "$(dpkg-deb -f "$deb" Version)" = "${{ needs.plan.outputs.version }}" \
            || { echo "::error::deb 里的版本号与 chuang/__init__.py 对不上"; exit 1; }
          test "$(dpkg-deb -c "$deb" | wc -l)" -gt 10 \
            || { echo "::error::deb 是空的"; exit 1; }

      - name: 上传为工作流产物
        uses: actions/upload-artifact@v5
        with:
          name: chuang-deb
          path: |
            packaging/out/*.deb
            packaging/out/SHA256SUMS

  publish:
    name: 发 Release 并附加 .deb
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 取回刚打好的 .deb
        uses: actions/download-artifact@v5
        with:
          name: chuang-deb
          path: packaging/out

      - name: 写 Release 说明（取自 CHANGELOG.md）
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if ! python3 packaging/release-notes.py "$VERSION" > notes.md; then
            echo "::warning::CHANGELOG.md 里没有 $VERSION 的段落，Release 说明只放一个链接"
            printf '本次改动见 [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)。\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > notes.md
          fi
          cat notes.md

      - name: 建 Release（tag 不存在时会一并创建）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: |
            packaging/out/*.deb
            packaging/out/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          make_latest: true

      - name: 收尾说明
        run: |
          {
            echo "### 已发布 ${{ needs.plan.outputs.tag }}"
            echo
            echo "- 原因：${{ needs.plan.outputs.reason }}"
            echo "- 下载：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ needs.plan.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
